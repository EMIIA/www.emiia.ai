<!DOCTYPE html>
<html>
<head>
    <title>Open WebUI</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            background: #000; /* на случай загрузки */
        }
        
        .iframe-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            display: block;
        }
        
        /* Для мобильных устройств — гарантируем 100% высоты */
        @media (max-width: 768px) {
            body {
                height: -webkit-fill-available;
            }
            .iframe-container {
                height: -webkit-fill-available;
            }
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe 
            src="https://concord-christopher-hawaiian-twice.trycloudflare.com" 
            allow="camera; microphone; clipboard-read; clipboard-write; autoplay; fullscreen"
            allowfullscreen
            sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-modals">
        </iframe>
    </div>
</body>
</html>
