<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>EMIIA.AI — рабочий пример</title>

    <link rel="manifest" href="https://sos.emiia.ai/manifest.json">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
        }
        
        /* ТВОЙ КОНТЕЙНЕР — КАК В РАБОЧЕМ ПРИМЕРЕ */
        .container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-y: auto;
        }
        
        /* ТВОЙ КОНТЕНТ */
        .content {
            padding: 20px;
            padding-top: calc(60px + env(safe-area-inset-top));
            padding-bottom: calc(60px + env(safe-area-inset-bottom));
        }
        
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="card">
                <h2>✅ Рабочий пример</h2>
                <p>Этот код взят из твоего работающего примера. Здесь прозрачность ЕСТЬ.</p>
            </div>
            <div class="card">
                <h2>📱 Что дальше</h2>
                <p>Вставь сюда свою карту Mapbox вместо этого текста.</p>
            </div>
        </div>
    </div>
</body>
</html>
