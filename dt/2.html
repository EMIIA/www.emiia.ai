<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Карта на весь экран</title>

    <!-- Стили Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* Убираем всё лишнее, чтобы не было черных полос */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: white;
            overflow: hidden;
        }

        /* Карта на весь экран */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Плашка внизу, как ты просил */
        .overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            /* Учет "полоски" iPhone снизу */
            padding-bottom: env(safe-area-inset-bottom, 20px);
            pointer-events: none;
        }

        .header-glass {
            margin-bottom: 20px;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.9);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            color: black;
            font-weight: bold;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="overlay">
        <div class="header-glass">
            Карта видна и статус-бар прозрачный 📍
        </div>
    </div>

    <!-- Скрипты -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        function initMap() {
            // Создаем карту
            var map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([55.7558, 37.6173], 10);

            // Добавляем слой тайлов
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19
            }).addTo(map);

            // Принудительное обновление размера через мгновение
            setTimeout(function() {
                map.invalidateSize();
            }, 200);
        }

        // Запуск после загрузки страницы
        window.onload = initMap;
    </script>
</body>
</html>
