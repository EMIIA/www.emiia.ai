<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>No Borders</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* Цвет фона ДОЛЖЕН совпадать с преобладающим цветом карты (бежевый/серый) */
            background: #f8f4f0; 
            overflow: hidden;
        }

        #map {
            position: fixed;
            /* Выносим карту за границы экрана на 100px вверх и вниз */
            top: -50px;
            bottom: -50px;
            left: 0;
            right: 0;
            width: 100vw;
            /* Высота больше 100%, чтобы перекрыть системные зазоры */
            height: calc(100vh + 100px); 
            z-index: 1;
        }

        /* Убираем рамки внутри самого Leaflet */
        .leaflet-container {
            background-color: #f8f4f0 !important;
            outline: none;
        }

        .overlay {
            position: fixed;
            bottom: env(safe-area-inset-bottom, 20px);
            left: 0;
            right: 0;
            z-index: 1000;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .header-glass {
            padding: 12px 25px;
            background: rgba(255, 255, 255, 0.9);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            font-family: sans-serif;
            font-weight: 900;
            pointer-events: auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="overlay">
        <div class="header-glass">КАРТА В КРАЯХ 📍</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        window.onload = function() {
            var map = L.map('map', {
                zoomControl: false,
                attributionControl: false
            }).setView([55.7558, 37.6173], 12);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // Принудительно растягиваем сетку внутри контейнера
            setTimeout(() => {
                map.invalidateSize();
            }, 300);
        };
    </script>
</body>
</html>
