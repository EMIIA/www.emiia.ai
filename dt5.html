<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>EMIIA.AI MRV — РАБОЧИЙ КОД</title>

    <style>
        /* --- ПОЛНАЯ КОПИЯ СТИЛЕЙ ИЗ ВАШЕГО РАБОЧЕГО ПРИМЕРА --- */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent !important;
        }

        /* Принудительно тянем canvas карты на весь экран */
        .mapboxgl-map,
        .mapboxgl-canvas-container,
        .mapboxgl-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
        }
        
        /* Тестовый элемент, чтобы увидеть, что полоса исчезла */
        .test-status {
            position: fixed;
            top: 10px;
            left: 10px;
            background: red;
            color: white;
            padding: 5px 10px;
            z-index: 99999;
            font-size: 12px;
            border-radius: 5px;
        }
    </style>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet">
</head>
<body>
    <div id="map"></div>
    <div class="test-status">✅ Если эта кнопка видна под часами — полосы нет</div>

    <script>
        // Принудительный сброс отступов (как в вашем примере)
        document.body.style.margin = '0';
        document.body.style.padding = '0';
        document.documentElement.style.margin = '0';
        document.documentElement.style.padding = '0';
        
        mapboxgl.accessToken = 'pk.eyJ1IjoicHJvY3Jhc3RpbmF0aW8iLCJhIjoiY2o4b3FtcW42MDZpNjJ4bnQxMWR0ejl4dSJ9.3ORIDvrfCQZ_UUyc1f2pUw';
        
        const map = new mapboxgl.Map({ 
            container: 'map', 
            style: 'https://sos.emiia.ai/moscow_style_2.json', 
            center: [37.6357745, 55.8383770], 
            zoom: 20, 
            pitch: 30, 
            attributionControl: false, 
            bearing: 0
        });
        
        // Фикс для принудительного растягивания canvas после загрузки
        map.on('load', function() {
            document.querySelector('.mapboxgl-canvas').style.height = '100%';
            map.resize();
        });
    </script>
</body>
</html>
