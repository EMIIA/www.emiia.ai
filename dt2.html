<!DOCTYPE html>
<html>
<head>
    <title>ПРОСТРАНСТВЕННЫЙ ИНТЕЛЛЕКТ</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: dark)">
    
    <style>
        /* === ОСНОВА === */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }

        /* === КАРТА — БЕЗ ФОНА === */
        #map {
            position: fixed !important;
            top: 0 !important;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
        }

        /* === РАСТЯГИВАЕМ CANVAS === */
        .mapboxgl-map,
        .mapboxgl-canvas-container,
        .mapboxgl-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            background: transparent !important;
        }

        /* === КОМПАС === */
        #custom-compass {
            position: fixed !important;
            top: calc(20px + env(safe-area-inset-top)) !important;
            left: 20px !important;
            z-index: 1000;
        }

        /* === МЕНЮ === */
        #controls {
            position: fixed;
            bottom: calc(70px + env(safe-area-inset-bottom));
            left: 25px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 38px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            max-width: 280px;
            min-width: 280px;
            backdrop-filter: blur(10px);
        }

        /* === ЛОГО === */
        .header1 { 
            position: fixed; 
            bottom: calc(50px + env(safe-area-inset-bottom));
            right: 5%; 
            z-index: 20000;
        }
        
        @media (max-width: 768px) {
            #controls {
                bottom: calc(17px + env(safe-area-inset-bottom)) !important;
                left: 29px !important;
            }
            #custom-compass {
                top: calc(20px + env(safe-area-inset-top)) !important;
                left: 15px !important;
            }
        }
    </style>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet">
</head>
<body>
    <div id="map"></div>
    
    <div class="header1">
        <svg width="70" height="70" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="20" fill="#3d85c6"/>
        </svg>
    </div>

    <script>
        const MAPBOX_TOKEN = 'pk.eyJ1IjoicHJvY3Jhc3RpbmF0aW8iLCJhIjoiY2o4b3FtcW42MDZpNjJ4bnQxMWR0ejl4dSJ9.3ORIDvrfCQZ_UUyc1f2pUw';
        
        let map = null;
        
        function initializeMap() {
            mapboxgl.accessToken = MAPBOX_TOKEN;
            map = new mapboxgl.Map({ 
                container: 'map', 
                style: 'mapbox://styles/mapbox/light-v11',
                center: [37.6357745, 55.8383770], 
                zoom: 18,
                attributionControl: false
            });
            
            map.on('load', () => {
                // Принудительно растягиваем canvas
                setTimeout(() => {
                    map.resize();
                    const canvas = document.querySelector('.mapboxgl-canvas');
                    if (canvas) {
                        canvas.style.height = '100%';
                        canvas.style.width = '100%';
                    }
                }, 100);
            });
        }
        
        // Сброс отступов перед инициализацией
        document.body.style.margin = '0';
        document.body.style.padding = '0';
        document.documentElement.style.margin = '0';
        document.documentElement.style.padding = '0';
        
        initializeMap();
    </script>
</body>
</html>
