<!DOCTYPE html>
<html>
<head>
    <title>ПРОСТРАНСТВЕННЫЙ ИНТЕЛЛЕКТ</title>
    <meta charset="UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: dark)">
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sos.emiia.ai/" />
    <meta property="og:title" content="EMIIA.AI MRV"/>
    <meta property="og:description" content="Safe environment" />
    <meta property="og:image" content="https://sos.emiia.ai/sos_500_500.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <style>
        /* === 1. ОСНОВА (Убираем серую полосу) === */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent !important;
        }

        /* === 2. КАРТА - FIXED, А НЕ ABSOLUTE! === */
        #map {
            position: fixed !important;
            top: 0 !important;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
        }

        /* === 3. КАНВАС MAPBOX - ТОЖЕ FIXED! === */
        .mapboxgl-map,
        .mapboxgl-canvas-container,
        .mapboxgl-canvas {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            background: transparent !important;
        }

        /* === 4. КОМПАС === */
        #custom-compass {
            position: fixed !important;
            top: calc(20px + env(safe-area-inset-top, 20px)) !important;
            left: 20px !important;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 44px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }

        /* === 5. МЕНЮ === */
        #controls {
            position: fixed;
            bottom: calc(70px + env(safe-area-inset-bottom));
            left: 25px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 38px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            max-width: 280px;
            min-width: 280px;
            max-height: 80vh;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        /* === 6. ЛОГОТИП === */
        .header1 { 
            position: fixed; 
            bottom: calc(50px + env(safe-area-inset-bottom));
            right: 5%; 
            z-index: 20000;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            padding: 8px;
            backdrop-filter: blur(8px);
        }

        /* === 7. АДАПТИВ === */
        @media (max-width: 768px) {
            #controls {
                bottom: calc(17px + env(safe-area-inset-bottom)) !important;
                left: 29px !important;
                padding-bottom: 20px;
            }
            .header1 { 
                bottom: calc(0px + env(safe-area-inset-bottom)); 
                right: 1%; 
            }
            #custom-compass {
                top: calc(20px + env(safe-area-inset-top)) !important;
                left: 15px !important;
            }
        }

        /* === 8. ДОПОЛНИТЕЛЬНЫЕ СТИЛИ === */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        .mapboxgl-popup {
            max-width: none !important;
            z-index: 2000;
        }
    </style>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.css" rel="stylesheet">
</head>
<body>
    <div id="map"></div>
    
    <div id="controls" style="display: none;">
        <!-- Ваше меню, если нужно -->
    </div>

    <div class="header1">
        <svg width="50" height="50" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="20" fill="#3d85c6"/>
        </svg>
    </div>

    <script>
        // Принудительный сброс отступов
        document.body.style.margin = '0';
        document.body.style.padding = '0';
        document.documentElement.style.margin = '0';
        document.documentElement.style.padding = '0';
        
        // Глобальные переменные
        let map = null;
        const MAPBOX_TOKEN = 'pk.eyJ1IjoicHJvY3Jhc3RpbmF0aW8iLCJhIjoiY2o4b3FtcW42MDZpNjJ4bnQxMWR0ejl4dSJ9.3ORIDvrfCQZ_UUyc1f2pUw';
        
        // Функция создания компаса
        function createCustomCompass() {
            const oldCompass = document.getElementById('custom-compass');
            if (oldCompass) oldCompass.remove();
            
            const compass = document.createElement('button');
            compass.id = 'custom-compass';
            compass.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3d85c6" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <polygon points="12 2 15 9 22 12 15 15 12 22 9 15 2 12 9 9 12 2" fill="#3d85c6" stroke="none"/>
                </svg>
            `;
            compass.style.cssText = `
                position: fixed;
                top: calc(20px + env(safe-area-inset-top, 20px));
                left: 20px;
                width: 44px;
                height: 44px;
                background: rgba(255, 255, 255, 0.9);
                backdrop-filter: blur(12px);
                border-radius: 44px;
                border: none;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 10000;
                box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            `;
            compass.addEventListener('click', () => {
                if (map) {
                    map.flyTo({
                        center: [37.6357745, 55.8383770],
                        zoom: 18,
                        duration: 1000
                    });
                }
            });
            document.body.appendChild(compass);
            return compass;
        }
        
        // Инициализация карты
        function initializeMap() {
            mapboxgl.accessToken = MAPBOX_TOKEN;
            
            map = new mapboxgl.Map({ 
                container: 'map', 
                style: 'mapbox://styles/mapbox/light-v11',
                center: [37.6357745, 55.8383770], 
                zoom: 18,
                pitch: 0,
                bearing: 0,
                maxZoom: 24,
                attributionControl: false,
                antialias: true
            });
            
            map.on('load', () => {
                console.log('Карта загружена');
                createCustomCompass();
                
                // Принудительное растягивание canvas
                setTimeout(() => {
                    map.resize();
                    const canvas = document.querySelector('.mapboxgl-canvas');
                    if (canvas) {
                        canvas.style.position = 'fixed';
                        canvas.style.top = '0';
                        canvas.style.left = '0';
                        canvas.style.width = '100%';
                        canvas.style.height = '100%';
                    }
                }, 100);
            });
            
            // При изменении размера окна
            window.addEventListener('resize', () => {
                setTimeout(() => {
                    map.resize();
                }, 100);
            });
        }
        
        // Запуск
        initializeMap();
    </script>
</body>
</html>
